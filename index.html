<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Prose Apothecary - Healing Through Reading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-sanctuary: #fcf9f2;
        --text-ink: #1a1a1a;
        --accent-emerald: #0f2e2e;
        --accent-mahogany: #4a1010;
        --accent-gold: #c5a059;
        --accent-midnight: #1a2a33;
      }
      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-sanctuary);
        background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
        color: var(--text-ink);
        font-size: 16px;
        line-height: 1.8;
      }
      h1, h2, h3, h4, .font-serif {
        font-family: 'Cormorant Garamond', serif;
        letter-spacing: -0.01em;
      }
      .page-layer {
        background: white;
        box-shadow: 
          0 15px 50px -20px rgba(0,0,0,0.15), 
          0 2px 5px rgba(0,0,0,0.05);
        border: 1px solid rgba(197, 160, 89, 0.25);
        position: relative;
      }
      .btn-apothecary {
        background: var(--accent-mahogany);
        color: white;
        padding: 1.25rem 3rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.35em;
        font-size: 11px;
        transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        border: 1px solid var(--accent-mahogany);
        box-shadow: 0 10px 30px -10px rgba(74, 16, 16, 0.4);
      }
      .btn-apothecary:hover {
        background: white;
        color: var(--accent-mahogany);
        transform: translateY(-3px);
      }
      .gold-leaf {
        color: var(--accent-gold);
      }
      .book-shadow {
        box-shadow: 20px 20px 60px rgba(0,0,0,0.3);
      }
      .ink-gradient {
        background: linear-gradient(135deg, var(--accent-mahogany), var(--accent-midnight));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .bg-emerald-sanctuary { background-color: var(--accent-emerald); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
